<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>SMART SAFETY</title>
<style>html,body{margin:0;height:100%;background:#0f172a;color:#fff;font-family:system-ui,"Noto Sans Thai",sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
.s{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:24px;text-align:center;box-sizing:border-box}
img{width:120px;border-radius:28px}h1{font-size:26px;margin:16px 0 6px}p{color:#cbd5e1;font-size:18px;line-height:1.5;margin:6px 0}
.b{display:block;width:min(360px,90vw);border:0;border-radius:20px;padding:20px;font-size:22px;font-weight:800;color:#fff;background:#16a34a;margin:14px auto 0}
.g{background:#334155;font-size:18px;padding:16px}.tag{background:#f59e0b;color:#000;border-radius:99px;padding:3px 12px;font-weight:700;font-size:13px}
.hide{display:none}</style></head><body>
<div id="home" class="s"><span class="tag">ตัวอย่าง PWA</span><img src="icon-512.png" alt=""><h1>SMART SAFETY</h1><p>ศูนย์สั่งการ เทศกิจเมืองพัทยา</p>
<div id="inst" class="hide"><button class="b" id="ib">📲 ติดตั้งลงหน้าจอ</button></div>
<div id="ios" class="hide"><p>iPhone: กดปุ่ม <b>แชร์</b> ⬆️ แล้วเลือก<br><b>"เพิ่มไปยังหน้าจอโฮม"</b></p></div>
<div id="line" class="hide"><p>กำลังเปิดใน LINE<br>กดปุ่มด้านล่างเพื่อเปิดในเบราว์เซอร์แล้วติดตั้ง</p><button class="b" onclick="ext()">เปิดในเบราว์เซอร์</button></div>
<button class="b g" onclick="go()">เข้าใช้งานระบบ</button></div>
<iframe id="app" allow="geolocation; camera" title="SMART SAFETY"></iframe>
<script>
var EXEC='https:'+'\/\/script.google.com/macros/s/AKfycbwH8PjktorVLFiQaReI4A-9jAA7yncqzVDThBx4tR2NrdHotyu7kqMb7HXBE-6Yqdar/exec';
var ua=navigator.userAgent,sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
function go(){var f=document.getElementById('app');f.src=EXEC;f.style.display='block';document.getElementById('home').style.display='none'}
function ext(){location.href=location.href.split('?')[0]+'?openExternalBrowser=1'}
var dp;addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;if(!sa)document.getElementById('inst').classList.remove('hide')});
document.getElementById('ib').onclick=function(){if(dp){dp.prompt();dp=null}};
if(sa)go();else if(/Line\//i.test(ua))document.getElementById('line').classList.remove('hide');else if(/iPhone|iPad/i.test(ua))document.getElementById('ios').classList.remove('hide');
</script></body></html>

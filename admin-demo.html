<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin: อนุมัติลงทะเบียน</title>
<style>body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:16px}.tag{background:#f59e0b;color:#000;padding:4px 10px;border-radius:8px;font-size:14px}h1{font-size:22px}.f{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.f button{flex:1;font-size:17px;padding:12px;border-radius:10px;border:2px solid #475569;background:#1e293b;color:#fff}.f button.on{background:#2563eb;border-color:#2563eb}.c{background:#1e293b;border-radius:14px;padding:14px;margin:10px 0}.c b{font-size:19px}.c small{color:#cbd5e1;font-size:15px;display:block;margin:4px 0 10px}.a{display:flex;gap:8px}.a button{flex:1;font-size:18px;padding:12px;border:0;border-radius:10px;color:#fff}.y{background:#16a34a}.n{background:#dc2626}.st{font-weight:bold}#all{width:100%;font-size:19px;padding:14px;border:0;border-radius:12px;background:#16a34a;color:#fff;margin:6px 0}#cnt{color:#cbd5e1}</style></head><body>
<span class="tag">ตัวอย่างหน้า admin - ข้อมูลสมมติ</span><h1>📋 อนุมัติลงทะเบียนสายตรวจ</h1>
<div class="f" id="fz"></div><div class="f" id="fs"></div><div id="cnt"></div><button id="all">✔ อนุมัติทั้งหมดที่แสดง</button><div id="list"></div>
<script>var R=[['6901020','ธรรมกร ใจดี','นาเกลือ','ดึก','เสาร์, อาทิตย์'],['6901021','สมชาย มั่นคง','พัทยา','เช้า','จันทร์'],['6901022','วิชัย ทองดี','จอมเทียน','บ่าย','พุธ, พฤหัสบดี'],['6901023','สมศักดิ์ รักงาน','พัทยา','ดึก','อาทิตย์'],['6901024','ประเสริฐ ศรีสุข','นาเกลือ','เช้า','ศุกร์, เสาร์'],['6901025','อนันต์ แสงทอง','จอมเทียน','ดึก','อังคาร'],['6901026','ชัยวัฒน์ ใจกล้า','กระเบนธง','บ่าย','พฤหัสบดี']].map(function(r){return{id:r[0],nm:r[1],z:r[2],s:r[3],d:r[4],st:'รอยืนยัน'}});
var Z='ทุกเขต',S='ทุกผลัด';
function fb(id,arr,set){var c=document.getElementById(id);arr.forEach(function(x,i){var b=document.createElement('button');b.textContent=x;if(!i)b.className='on';b.onclick=function(){[].forEach.call(c.children,function(k){k.className=''});b.className='on';set(x);draw()};c.appendChild(b)})}
fb('fz',['ทุกเขต','พัทยา','นาเกลือ','จอมเทียน','กระเบนธง'],function(x){Z=x});fb('fs',['ทุกผลัด','เช้า','บ่าย','ดึก'],function(x){S=x});
function vis(){return R.filter(function(r){return(Z=='ทุกเขต'||r.z==Z)&&(S=='ทุกผลัด'||r.s==S)})}
function draw(){var v=vis(),w=v.filter(function(r){return r.st=='รอยืนยัน'}).length;document.getElementById('cnt').textContent='แสดง '+v.length+' คน / รอยืนยัน '+w+' คน';
document.getElementById('list').innerHTML=v.map(function(r){var col=r.st=='อนุมัติแล้ว'?'#4ade80':r.st=='ไม่อนุมัติ'?'#f87171':'#fbbf24';
return '<div class="c"><b>'+r.id+' '+r.nm+'</b><small>เขต'+r.z+' ผลัด'+r.s+' / หยุด: '+r.d+'</small><div class="st" style="color:'+col+'">'+r.st+'</div>'+(r.st=='รอยืนยัน'?'<div class="a"><button class="y" onclick="setSt(\''+r.id+'\',\'อนุมัติแล้ว\')">✔ อนุมัติ</button><button class="n" onclick="setSt(\''+r.id+'\',\'ไม่อนุมัติ\')">✖ ไม่อนุมัติ</button></div>':'')+'</div>'}).join('')}
function setSt(id,s){R.forEach(function(r){if(r.id==id)r.st=s});draw()}
document.getElementById('all').onclick=function(){vis().forEach(function(r){if(r.st=='รอยืนยัน')r.st='อนุมัติแล้ว'});draw()};draw();</script></body></html>

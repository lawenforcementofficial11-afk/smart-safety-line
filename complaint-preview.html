  $('app').innerHTML = '<section class="rounded-2xl overflow-hidden mb-6 shadow" style="background:linear-gradient(120deg,#0b2a5b,#123a7a)"><div class="p-8 md:p-12 text-white"><span class="inline-flex items-center gap-2 px-4 py-2 rounded-lg font-extrabold text-lg" style="background:#c9a227;color:#0b2a5b"><i class="fa-solid fa-flask"></i>ข้อมูลจำลองเพื่อการนำเสนอ</span>'
    + '<h1 class="text-3xl md:text-5xl font-extrabold mt-5 leading-tight">ระบบรับเรื่องร้องเรียน<br>เทศกิจเมืองพัทยา <span style="color:#e9d48a">(ฉบับทดลอง)</span></h1>'
    + '<p class="text-xl md:text-2xl mt-4 max-w-3xl text-slate-100">ช่องทางให้ประชาชนแจ้งเรื่องร้องเรียนและติดตามผลได้ด้วยตนเอง ผู้บังคับบัญชามอบหมายงานได้ทันที เจ้าหน้าที่รายงานผลพร้อมภาพจากจุดเกิดเหตุ และผู้บริหารเห็นภาพรวมการปฏิบัติงานแบบเรียลไทม์</p>'
    + '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">' + [['เรื่องในระบบ (จำลอง)', S.total], ['เสร็จสิ้น', S.byStatus.done || 0], ['ปิดเรื่องเฉลี่ย (วัน)', S.avg == null ? '-' : S.avg.toFixed(1)], ['ช่วงข้อมูล (วัน)', days]].map(x => '<div class="rounded-xl p-4" style="background:rgba(255,255,255,.1);border:1px solid rgba(233,212,138,.4)"><p class="text-4xl font-extrabold">' + x[1] + '</p><p class="text-base" style="color:#e9d48a">' + x[0] + '</p></div>').join('') + '</div></div></section>'
    + '<section class="card p-6 mb-6"><h2><i class="fa-solid fa-diagram-project gold"></i>ขั้นตอนการทำงาน</h2><div class="flex flex-wrap lg:flex-nowrap gap-4 justify-center">'
    + step(1, 'ประชาชนยื่นเรื่อง', 'ระบุประเภท ภาพ และตำแหน่ง รับเลขที่ทันที', 'fa-solid fa-pen-to-square', '#64748b') + arrow + step(2, 'ผู้บังคับบัญชามอบหมาย', 'เลือกเจ้าหน้าที่ กำหนดความเร่งด่วนและวันแล้วเสร็จ', 'fa-solid fa-user-check', '#7c3aed') + arrow
    + step(3, 'เจ้าหน้าที่ลงพื้นที่', 'ยืนยันตำแหน่งด้วย GPS ดำเนินการแก้ไข', 'fa-solid fa-person-walking-arrow-right', '#ea580c') + arrow + step(4, 'รายงานผลและปิดเรื่อง', 'ภาพก่อน/หลัง ผู้บังคับบัญชาตรวจและปิดเรื่อง', 'fa-solid fa-circle-check', '#16a34a') + arrow
    + step(5, 'ผู้บริหารติดตาม', 'สรุปสถิติ แผนที่ และผลงานรายบุคคล', 'fa-solid fa-chart-column', '#0b2a5b') + '</div></section>'
    + '<h2 class="text-2xl font-extrabold text-[#0b2a5b] mb-4 flex items-center gap-2"><i class="fa-solid fa-hand-pointer gold"></i>เลือกหน้าจอที่ต้องการทดลอง</h2><div class="grid md:grid-cols-2 gap-5 mb-6">'
    + card('citizen', 'ประชาชนยื่นเรื่อง', 'แบบฟอร์มร้องเรียน 8 ประเภท พร้อมภาพและแผนที่ ได้รับใบรับเรื่อง', 'fa-solid fa-pen-to-square', '#0b2a5b')
    + card('track', 'ติดตามเรื่อง', 'กรอกเลขที่รับเรื่อง ดูสถานะและผลการดำเนินการ', 'fa-solid fa-magnifying-glass', '#0369a1')
    + card('commander', 'ผู้บังคับบัญชา', 'กล่องรับเรื่อง กรองข้อมูล มอบหมายเจ้าหน้าที่ ปิดเรื่อง', 'fa-solid fa-inbox', '#7c3aed')
    + card('officer', 'เจ้าหน้าที่', 'งานที่ได้รับมอบหมาย นำทาง เช็กอินจุดเกิดเหตุ รายงานผล', 'fa-solid fa-user-shield', '#ea580c')
    + '<div class="md:col-span-2">' + card('exec', 'ผู้บริหาร', 'แดชบอร์ดสรุปผล สถานะ ประเภท พื้นที่ แผนที่ ผลงานรายบุคคล และดาวน์โหลด Excel', 'fa-solid fa-chart-column', '#c9a227') + '</div></div>'
    + '<section class="card p-5"><h2><i class="fa-solid fa-circle-info gold"></i>หมายเหตุ</h2><div class="mb-3">' + legend() + '</div><p class="text-lg text-slate-700">ข้อมูลทั้งหมดในเว็บนี้เป็นข้อมูลจำลองเพื่อการนำเสนอ ชื่อบุคคลทั้งหมดเป็นชื่อสมมติ ไม่ใช่เจ้าหน้าที่หรือประชาชนจริง สถานที่อ้างอิงพื้นที่สาธารณะในเมืองพัทยาเพื่อความสมจริงเท่านั้น และยังไม่เชื่อมต่อระบบจริง</p></section>';
}
function start() {
  load(); nav();
  if (VIEW === 'officer') { viewOfficer(); if (navigator.geolocation) navigator.geolocation.watchPosition(p => { GPS = { lat: p.coords.latitude, lng: p.coords.longitude }; if (!$('mdl')) viewOfficer(); }, () => { }, { enableHighAccuracy: true, maximumAge: 10000 }); }
  else ({ home: viewHome, citizen: viewCitizen, track: viewTrack, commander: viewCommander, exec: viewExec }[VIEW] || viewHome)();
  if (VIEW === 'exec' || VIEW === 'home') $('app').classList.add('wide');
}
start();
</script></body></html>

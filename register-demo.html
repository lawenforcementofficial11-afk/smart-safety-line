<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลงทะเบียนสายตรวจ</title>
<style>body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:20px}.tag{background:#f59e0b;color:#000;padding:4px 10px;border-radius:8px;font-size:14px}h1{font-size:26px;text-align:center}label{display:block;font-size:22px;margin:18px 0 8px}input{width:100%;box-sizing:border-box;font-size:24px;padding:16px;border-radius:12px;border:0}.d{display:grid;grid-template-columns:1fr 1fr;gap:10px}.d button{font-size:22px;padding:20px;border-radius:14px;border:2px solid #475569;background:#1e293b;color:#fff}.d button.on{background:#16a34a;border-color:#16a34a}.d button.on:before{content:'✔ '}#s{width:100%;font-size:26px;padding:24px;border:0;border-radius:16px;margin-top:24px;background:#2563eb;color:#fff;font-weight:bold}#e{color:#fca5a5;font-size:20px;text-align:center}#ok{display:none;text-align:center;font-size:24px;line-height:1.6}#ok a{display:block;background:#16a34a;color:#fff;padding:24px;border-radius:16px;text-decoration:none;font-weight:bold;margin-top:20px}</style></head><body>
<span class="tag">ตัวอย่าง - ไม่บันทึกข้อมูลจริง</span><h1>📝 ลงทะเบียนสายตรวจ<br><small>SMART SAFETY</small></h1>
<div id="f"><label>รหัสพนักงาน</label><input id="id" inputmode="numeric" placeholder="เช่น 6901020">
<label>ชื่อ - นามสกุล</label><input id="nm" placeholder="ชื่อ นามสกุล">
<label>วันหยุดประจำสัปดาห์ (แตะเลือก)</label><div class="d" id="days"></div>
<div id="e"></div><button id="s">ส่งลงทะเบียน</button></div>
<div id="ok">✅ <b>ลงทะเบียนเรียบร้อย</b><br>รอ admin ยืนยัน<br><span id="sum" style="font-size:20px;color:#cbd5e1"></span><a href="gps.html">📍 ต่อไป: เปิดสิทธิ์ตำแหน่ง</a></div>
<script>var D=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'],box=document.getElementById('days');
D.forEach(function(x){var b=document.createElement('button');b.textContent=x;b.onclick=function(){b.classList.toggle('on')};box.appendChild(b)});
document.getElementById('s').onclick=function(){var id=document.getElementById('id').value.trim(),nm=document.getElementById('nm').value.trim(),sel=[].filter.call(box.children,function(b){return b.classList.contains('on')}).map(function(b){return b.textContent}),e=document.getElementById('e');
if(!/^\d{4,10}$/.test(id))return e.textContent='กรุณาใส่รหัสพนักงานเป็นตัวเลข';
if(nm.length<3)return e.textContent='กรุณาใส่ชื่อ - นามสกุล';
if(!sel.length)return e.textContent='กรุณาเลือกวันหยุดอย่างน้อย 1 วัน';
document.getElementById('f').style.display='none';document.getElementById('sum').textContent=id+' '+nm+' / หยุด: '+sel.join(', ');document.getElementById('ok').style.display='block'};</script></body></html>
